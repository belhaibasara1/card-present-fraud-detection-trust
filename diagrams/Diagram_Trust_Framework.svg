<svg viewBox="0 0 1300 880" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="tarrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker></defs>
<rect width="1300" height="880" fill="#FFFFFF"/>
<text x="650.0" y="34" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1E3A5F">Trustworthiness Assessment Framework</text><text x="650.0" y="55" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic" fill="#64748B">Combining traffic light tier with SHAP consistency to decide when to trust automated detection</text><rect x="260" y="120" width="380" height="50" fill="#334155"/><text x="450.0" y="137.0" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="700" fill="#FFFFFF">SHAP Consistency: LOW</text><text x="450.0" y="153.0" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="700" fill="#FFFFFF">(RF and XGBoost disagree)</text><rect x="640" y="120" width="380" height="50" fill="#334155"/><text x="830.0" y="137.0" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="700" fill="#FFFFFF">SHAP Consistency: HIGH</text><text x="830.0" y="153.0" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="700" fill="#FFFFFF">(RF and XGBoost agree)</text><rect x="0" y="170" width="260" height="130" fill="#10B981" stroke="#1E3A5F" stroke-width="1.5"/><text x="130.0" y="227.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF">GREEN</text><text x="130.0" y="243.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF">score below 0.3</text><rect x="0" y="300" width="260" height="130" fill="#F59E0B" stroke="#1E3A5F" stroke-width="1.5"/><text x="130.0" y="357.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF">ORANGE</text><text x="130.0" y="373.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF">score 0.3 to 0.7</text><rect x="0" y="430" width="260" height="130" fill="#EF4444" stroke="#1E3A5F" stroke-width="1.5"/><text x="130.0" y="487.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF">RED</text><text x="130.0" y="503.0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF">score 0.7 and above</text><rect x="260" y="170" width="380" height="130" fill="#FBBF24" stroke="#1E3A5F" stroke-width="1.5"/><text x="450.0" y="200" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#1E3A5F">CAUTION</text><text x="450.0" y="222" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#1E3A5F">Auto approve, but sample</text><text x="450.0" y="237" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#1E3A5F">for periodic audit since</text><text x="450.0" y="252" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#1E3A5F">models disagree on cause</text><rect x="640" y="170" width="380" height="130" fill="#10B981" stroke="#1E3A5F" stroke-width="1.5"/><text x="830.0" y="200" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#FFFFFF">TRUST *</text><text x="830.0" y="222" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">Auto approve with high</text><text x="830.0" y="237" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">confidence, explanation</text><text x="830.0" y="252" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">reliable across models</text><rect x="260" y="300" width="380" height="130" fill="#F59E0B" stroke="#1E3A5F" stroke-width="1.5"/><text x="450.0" y="330" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#FFFFFF">REVIEW PLUS</text><text x="450.0" y="352" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">Manual review, treat</text><text x="450.0" y="367" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">explanation as unreliable,</text><text x="450.0" y="382" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">requires deeper inspection</text><rect x="640" y="300" width="380" height="130" fill="#FDBA74" stroke="#1E3A5F" stroke-width="1.5"/><text x="830.0" y="330" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#1E3A5F">REVIEW</text><text x="830.0" y="352" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#1E3A5F">Manual review, explanation</text><text x="830.0" y="367" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#1E3A5F">reliable, operator can trust</text><text x="830.0" y="382" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#1E3A5F">the stated reason</text><rect x="260" y="430" width="380" height="130" fill="#DC2626" stroke="#1E3A5F" stroke-width="1.5"/><text x="450.0" y="460" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#FFFFFF">BLOCK AND AUDIT</text><text x="450.0" y="482" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">Block transaction, but flag</text><text x="450.0" y="497" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">for audit as possible false</text><text x="450.0" y="512" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">positive given disagreement</text><rect x="640" y="430" width="380" height="130" fill="#EF4444" stroke="#1E3A5F" stroke-width="1.5"/><text x="830.0" y="460" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="700" fill="#FFFFFF">BLOCK</text><text x="830.0" y="482" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">Block with high confidence,</text><text x="830.0" y="497" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">explanation reliable across</text><text x="830.0" y="512" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#FFFFFF">both models</text><rect x="0" y="620" width="1020" height="130" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8,5"/><text x="20" y="648" font-family="Arial" font-size="13.5" font-weight="700" fill="#5B21B6">Known blind spot: mimicry attack pattern</text><text x="20" y="672" font-family="Arial" font-size="11.5" fill="#4C1D95">Transactions crafted to statistically resemble legitimate traffic can reach GREEN with</text><text x="20" y="690" font-family="Arial" font-size="11.5" fill="#4C1D95">high SHAP consistency, since both models learned the same, exploitable decision boundary.</text><text x="20" y="708" font-family="Arial" font-size="11.5" fill="#4C1D95">Verdict here is not TRUST by default: a fixed percentage of GREEN cases must be sampled</text><text x="20" y="726" font-family="Arial" font-size="11.5" fill="#4C1D95">for manual audit regardless of score, as established in the evasion resistance evaluation.</text><line x1="830" y1="620" x2="830" y2="566" stroke="#8B5CF6" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#tarrow)"/><text x="830" y="610" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="700" fill="#5B21B6">* overrides TRUST verdict above</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>