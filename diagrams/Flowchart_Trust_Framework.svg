<rect width="1000" height="520" fill="#F8FAFC"/>
<text x="500.0" y="35" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1E3A5F">Trustworthiness Assessment Framework</text><rect x="25" y="55" width="950" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><ellipse cx="48" cy="78" rx="8" ry="4" fill="#64748B"/><rect x="40" y="70" width="16" height="16" fill="#64748B" opacity="0.85"/><text x="66" y="82" font-family="Arial" font-size="10.5" fill="#334155">Data</text><rect x="224.0" y="70" width="18" height="16" rx="3" fill="#3B82F6"/><text x="250.0" y="82" font-family="Arial" font-size="10.5" fill="#334155">Process / Model</text><polygon points="408.0,78 413.0,70 421.0,70 426.0,78 421.0,86 413.0,86" fill="#F59E0B"/><text x="434.0" y="82" font-family="Arial" font-size="10.5" fill="#334155">Decision Outcome</text><rect x="592.0" y="70" width="18" height="16" rx="3" fill="#8B5CF6"/><text x="618.0" y="82" font-family="Arial" font-size="10.5" fill="#334155">Explainability (SHAP)</text><rect x="776.0" y="70" width="18" height="16" rx="3" fill="#EF4444"/><text x="802.0" y="82" font-family="Arial" font-size="10.5" fill="#334155">Threat Model (STRIDE)</text><polygon points="44.0,132.5 236.0,132.5 250.0,160 236.0,187.5 44.0,187.5 30.0,160" fill="#F59E0B" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="140" y="156" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#FFFFFF"><tspan x="140" dy="0">Detection Performance</tspan><tspan x="140" dy="16">(AUC, F1, per-attack rate)</tspan></text><rect x="390" y="160" width="220" height="55" rx="8" fill="#8B5CF6" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="500.0" y="179.5" text-anchor="middle" font-family="Arial" font-size="10.5"  fill="#FFFFFF"><tspan x="500.0" dy="0">Explainability Evidence</tspan><tspan x="500.0" dy="16">(SHAP consistency %)</tspan></text><rect x="640" y="160" width="220" height="55" rx="8" fill="#EF4444" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="750.0" y="179.5" text-anchor="middle" font-family="Arial" font-size="10.5"  fill="#FFFFFF"><tspan x="750.0" dy="0">Adversarial Robustness</tspan><tspan x="750.0" dy="16">(evasion resistance)</tspan></text><rect x="340" y="280" width="320" height="60" rx="8" fill="#1E3A5F" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="500.0" y="302.0" text-anchor="middle" font-family="Arial" font-size="11"  fill="#FFFFFF"><tspan x="500.0" dy="0">Trust Scoring Function</tspan><tspan x="500.0" dy="16">(weighted combination of the three)</tspan></text><line x1="250" y1="215" x2="500" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" /><rect x="353.0" y="237.5" width="44" height="16" fill="#FFFFFF" opacity="0.9"/><text x="375.0" y="249.5" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#334155">evidence</text><line x1="500" y1="215" x2="500" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" /><rect x="478.0" y="237.5" width="44" height="16" fill="#FFFFFF" opacity="0.9"/><text x="500.0" y="249.5" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#334155">evidence</text><line x1="750" y1="215" x2="500" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" /><rect x="603.0" y="237.5" width="44" height="16" fill="#FFFFFF" opacity="0.9"/><text x="625.0" y="249.5" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#334155">evidence</text><polygon points="64.0,392.5 236.0,392.5 250.0,420 236.0,447.5 64.0,447.5 50.0,420" fill="#10B981" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="150" y="416" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#FFFFFF"><tspan x="150" dy="0">Deploy</tspan><tspan x="150" dy="16">Auto-approve</tspan></text><polygon points="314.0,392.5 486.0,392.5 500.0,420 486.0,447.5 314.0,447.5 300.0,420" fill="#F59E0B" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="400" y="416" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#FFFFFF"><tspan x="400" dy="0">Deploy with</tspan><tspan x="400" dy="16">Human Oversight</tspan></text><polygon points="564.0,392.5 736.0,392.5 750.0,420 736.0,447.5 564.0,447.5 550.0,420" fill="#EF4444" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="650" y="416" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="700" fill="#FFFFFF"><tspan x="650" dy="0">Do Not Deploy</tspan><tspan x="650" dy="16">/ Requires Redesign</tspan></text><line x1="500" y1="340" x2="250" y2="420" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" /><line x1="500" y1="340" x2="500" y2="420" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" /><rect x="478.0" y="370.0" width="44" height="16" fill="#FFFFFF" opacity="0.9"/><text x="500.0" y="382.0" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#334155">recommendation</text><line x1="500" y1="340" x2="750" y2="420" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" /><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>